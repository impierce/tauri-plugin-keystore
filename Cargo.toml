[package]
name = "tauri-plugin-keystore"
version = "2.1.0-alpha.1"
authors = ["daniel-mader"]
description = "Interact with the device-native key storage (Android Keystore, iOS Keychain)."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/dist-js", "/guest-js", "/node_modules", "/package.json", "/rollup.config.js", "/tsconfig.json"]
links = "tauri-plugin-keystore"
repository = "https://github.com/impierce/tauri-plugin-keystore"
license = "Apache-2.0"

# The crate is `#![cfg(mobile)]`, so documenting it for the default host target
# would produce an empty page.
[package.metadata.docs.rs]
targets = ["x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "none", notes = "" }
linux = { level = "none", notes = "" }
macos = { level = "none", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }

[dependencies]
tauri = { version = "2" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6", features = ["build"] }

# [profile.release]
# panic = "abort"
# codegen-units = 1
# lto = true
# incremental = false
# opt-level = "s"
